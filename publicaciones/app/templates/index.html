<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Shell_Trading · Ideas y Estrategias</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
    aside { padding: 12px; overflow: auto; border-right: 1px solid #ddd; }
    #graph { width: 100%; height: 100%; }
    h2 { font-size: 15px; margin: 12px 0 4px; }
    li { font-size: 13px; margin: 3px 0; }
    button { font-size: 12px; }
  </style>
</head>
<body>
  <aside>
    <h2>ideas/draft (sin revisión)</h2>
    <ul id="draft"></ul>
    <h2>Ideas depuradas</h2>
    <ul id="ideas"></ul>
    <h2>Estrategias</h2>
    <ul id="strategies"></ul>
    <h2>Contexto (no operable)</h2>
    <ul id="context"></ul>
    <h2>Nueva estrategia</h2>
    <input id="new-strategy" placeholder="ej. ORB_NY">
    <button id="add-strategy">Crear</button>
    <h2>Promover draft</h2>
    <select id="promote-draft"></select>
    <select id="promote-strategy"></select>
    <button id="promote">Mover a Ideas</button>
    <h2>Limpiar ideas/draft (IA)</h2>
    <button id="clean">Limpiar draft seleccionado</button>
    <p id="status" style="font-size:12px;color:#555"></p>
  </aside>
  <div id="graph"></div>
  <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
